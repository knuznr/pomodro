name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and package run ID
        required: true
      tag:
        description: Version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify build and download packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run view "$RUN_ID" --json conclusion,headSha,headBranch,workflowName > run.json
          jq -e '.conclusion == "success" and .headBranch == "main" and .workflowName == "Test and package"' run.json
          echo "BUILD_SHA=$(jq -r .headSha run.json)" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --dir packages
          test -f packages/pomodoro-windows-x64/pomodoro-windows-x64.zip
          test -f packages/pomodoro-macos-arm64/pomodoro-macos-arm64.zip
          mkdir release
          cp packages/*/*.zip release/
          cd release
          unzip -t pomodoro-windows-x64.zip > /dev/null
          unzip -t pomodoro-macos-arm64.zip > /dev/null
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release/* --target "$BUILD_SHA" --title "Pomodro $TAG" --notes-file .github/release-notes.md
