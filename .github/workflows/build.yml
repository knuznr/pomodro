name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: pomodoro-windows-x64
            executable: dist/Pomodoro/Pomodoro.exe
          - os: macos-14
            artifact: pomodoro-macos-arm64
            executable: dist/Pomodoro.app/Contents/MacOS/Pomodoro
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: python -m PyInstaller --clean --noconfirm "Pomodoro Timer.spec"
      - name: Launch packaged application
        run: python scripts/smoke_package.py "${{ matrix.executable }}"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Pomodoro -DestinationPath dist/${{ matrix.artifact }}.zip
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pomodoro.app dist/${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
